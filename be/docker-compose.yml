services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - edge-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: retail_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - edge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d retail_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - edge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s       
      timeout: 5s         
      retries: 5

  # Cloud Server
  cloud-server:
    build:
      context: ./cloud-server
      dockerfile: Dockerfile
    container_name: cloud-server
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./cloud-server:/app
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - edge-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ETL Task - Chạy định kỳ để làm mới Data Warehouse
  etl-worker:
    build:
      context: ./cloud-server
      dockerfile: Dockerfile
    container_name: etl-worker
    volumes:
      - ./cloud-server:/app
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/retail_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge-network
    # Thay vì chạy uvicorn, nó chạy file script ETL của bạn
    command: python scripts/etl_process.py 
    # Lưu ý: Container này sẽ tắt sau khi chạy xong. 
    # Nếu muốn chạy định kỳ, bạn nên dùng Celery Beat hoặc đơn giản là Crontab trên host.

  # Edge Device Simulator (Branch 1)
  edge-device-1:
    build:
      context: ./edge-device
      dockerfile: Dockerfile
    container_name: edge-branch-1
    environment:
      - BRANCH_ID=HCM_Q1
      - BRANCH_NAME=Mart Quan 1
      - DEVICE_ID=EDGE_HCM_Q1_01
      - MQTT_BROKER=mosquitto:1883
      - CLOUD_API=http://cloud-server:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./edge-device:/app
    depends_on:
      - mosquitto
      - cloud-server
      - redis
    networks:
      - edge-network
    command: uvicorn edge_api:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"

  # Edge Device Simulator (Branch 2)
  edge-device-2:
    build:
      context: ./edge-device
      dockerfile: Dockerfile
    container_name: edge-branch-2
    environment:
      - BRANCH_ID=HCM_Q7
      - BRANCH_NAME=Mart Quan 7
      - DEVICE_ID=EDGE_HCM_Q7_01
      - MQTT_BROKER=mosquitto:1883
      - CLOUD_API=http://cloud-server:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./edge-device:/app
    depends_on:
      - mosquitto
      - cloud-server
      - redis
    networks:
      - edge-network
    command: uvicorn edge_api:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8002:8001"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - edge-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - edge-network
    depends_on:
      - prometheus

networks:
  edge-network:
    driver: bridge

volumes:
  mqtt-data:
  mqtt-logs:
  postgres-data:
  prometheus-data:
  grafana-data:
